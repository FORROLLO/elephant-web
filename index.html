<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Elephant</title>
<meta name="theme-color" content="#0D0A1A" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">

  <header id="topbar">
    <button id="btnBack" class="icon-btn" aria-label="Atrás">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <div id="addressWrap">
      <input id="addressInput" type="text" inputmode="url" placeholder="Busca o escribe una URL" />
    </div>
    <button id="btnReload" class="icon-btn" aria-label="Recargar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v6h-6"/></svg>
    </button>
    <button id="btnOpenExternalTop" class="icon-btn" aria-label="Abrir directo" title="Abrir directo en una pestaña nueva">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
    </button>
  </header>

  <main id="views">

    <section id="view-home" class="view active">
      <div class="home-logo">
        <svg viewBox="0 0 108 108" width="72" height="72"><path fill="currentColor" d="M54,20 C72,20 84,34 84,50 C84,62 78,70 70,76 L70,86 C70,90 66,92 63,89 L58,84 C56.5,84.3 55,84.5 53,84.5 C51,84.5 49.5,84.3 48,84 L43,89 C40,92 36,90 36,86 L36,76 C28,70 22,62 22,50 C22,34 36,20 54,20 Z"/><circle cx="44" cy="46" r="3.5" fill="#0D0A1A"/><circle cx="64" cy="46" r="3.5" fill="#0D0A1A"/></svg>
      </div>
      <h1>Elephant</h1>
      <p class="tagline">Navega libre. Navega seguro.</p>
      <div class="quicklinks" id="quicklinks"></div>
    </section>

    <section id="view-browse" class="view">
      <iframe id="browseFrame" title="Página web" referrerpolicy="no-referrer"></iframe>
      <div id="frameFallback" class="frame-fallback hidden">
        <p>Este sitio no permite abrirse dentro de Elephant.</p>
        <button id="btnOpenExternal">Abrir en pestaña nueva</button>
      </div>
    </section>

    <section id="view-downloads" class="view">
      <h2>Descargas</h2>
      <p class="hint">Se guarda dentro de Elephant, separado de tu galería. Exporta solo lo que quieras conservar.</p>

      <div class="fetchbox">
        <input id="mediaUrlInput" type="text" placeholder="Pega la URL directa de una imagen o video" />
        <button id="btnFetchMedia">Descargar</button>
      </div>
      <p id="fetchStatus" class="hint"></p>

      <div id="downloadsList" class="list"></div>
    </section>

    <section id="view-bookmarks" class="view">
      <h2>Marcadores</h2>
      <div id="bookmarksList" class="list"></div>
    </section>

    <section id="view-history" class="view">
      <div class="row-between">
        <h2>Historial</h2>
        <button id="btnClearHistory" class="link-btn">Borrar historial</button>
      </div>
      <div id="historyList" class="list"></div>
    </section>

    <section id="view-settings" class="view">
      <h2>Configuración</h2>
      <div class="list">
        <div class="settings-row"><span>Tema</span><span>Oscuro</span></div>
        <div class="settings-row"><span>Modo incógnito</span><span id="incognitoState">Desactivado</span></div>
        <div class="settings-row"><span>Versión</span><span>PWA 1.0</span></div>
      </div>
    </section>

  </main>

  <nav id="bottombar">
    <button data-view="home" class="nav-btn" aria-label="Inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </button>
    <button data-view="bookmarks" class="nav-btn" aria-label="Marcadores">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
    </button>
    <button data-view="downloads" class="nav-btn" aria-label="Descargas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
    </button>
    <button data-view="history" class="nav-btn" aria-label="Historial">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    </button>
    <button id="btnIncognito" class="nav-btn" aria-label="Incógnito">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="14" r="3"/><circle cx="17" cy="14" r="3"/><path d="M10 14h4"/><path d="M2 10l3-4h14l3 4"/></svg>
    </button>
    <button data-view="settings" class="nav-btn" aria-label="Configuración">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.04z"/></svg>
    </button>
  </nav>

</div>

<div id="elephantToast"></div>
<script src="app.js"></script>
</body>
</html>
